services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vuna_netacad
      POSTGRES_USER: vuna
      POSTGRES_PASSWORD: vuna_dev_password
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuna -d vuna_netacad"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    build: .
    command: sh -c "python manage.py migrate --run-syncdb && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DATABASE_URL: postgres://vuna:vuna_dev_password@db:5432/vuna_netacad
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [media_data:/app/media]
  worker:
    build: .
    command: celery -A config worker -l INFO
    env_file: .env
    environment:
      DATABASE_URL: postgres://vuna:vuna_dev_password@db:5432/vuna_netacad
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
volumes:
  postgres_data:
  redis_data:
  media_data:
